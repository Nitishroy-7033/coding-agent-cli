[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-coder"
version = "0.1.0"
description = "A CLI coding agent powered by custom OpenAI-compatible API endpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0.0",
    "textual>=0.40.0",
    "pathspec>=0.11.0",
    "tiktoken>=0.7.0",
    "chromadb>=0.4.0",
    "python-lsp-server>=1.0.0",
]

[project.scripts]
dev-coder = "agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
